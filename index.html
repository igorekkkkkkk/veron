<!DOCTYPE html>
<html>
<head>
    <title>Food AI</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }
        .box {
            background: white;
            padding: 30px;
            margin: 100px auto;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            border: none;
            background: #4CAF50;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🍔 Food AI</h2>

    <input type="file" id="file"><br><br>
    <input type="number" id="weight" placeholder="Вес (г)" value="100"><br><br>

    <button onclick="send()">Анализировать</button>

    <h3 id="result"></h3>
</div>

<script>
async function send() {
    let file = document.getElementById("file").files[0];
    let weight = document.getElementById("weight").value;

    let formData = new FormData();
    formData.append("file", file);
    formData.append("weight", weight);

    let res = await fetch("http://127.0.0.1:8000/predict", {
        method: "POST",
        body: formData
    });

    let data = await res.json();

    document.getElementById("result").innerHTML =
        "🍽 " + data.food + "<br>🔥 " + data.calories + " kcal";
}
</script>

</body>
</html>
